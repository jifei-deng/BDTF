agent:
  n_critics: 4
  hidden: 256
  bootstrap_p: 0.8
  discount: 0.99
  tau: 0.005
  policy_freq: 2
  actor_lr: 3.0e-4
  critic_lr: 3.0e-4
  vae_lr: 1.0e-3
  policy_noise: 0.2
  noise_clip: 0.5
  bias_c: 1.0
  lambda_dis: 1.0
  n_mmd_samples: 20
  mmd_kernel: gaussian
  mmd_sigma: 10.0
  eps_bar: 0.05
  delta_init: 1.0
  delta_lr: 1.0e-3
  delta_max: 100.0

train:
  batch_size: 256
