# D4RL halfcheetah-medium-replay-v2, evaluated on Gym MuJoCo HalfCheetah-v3.

task:
  kind: d4rl
  env: halfcheetah
  level: medium-replay

agent:
  n_critics: 10
  eps_bar: 0.2
  mmd_kernel: laplacian
  mmd_sigma: 10.0

train:
  steps: 500000             # gradient steps
  pretrain_steps: 40000     # behaviour-model (CVAE) pre-training
  eval_every: 10000

eval:
  episodes: 10
  horizon: 1000
